[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "project"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy<2.3",
    "pandas>=2.0",
    "scipy",
    "statsmodels",
    "matplotlib",
    "pyyaml",
    "wrds",
    "torch",
    "pyarrow>=16",
    "streamlit",
    "plotly"
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]